<title>운동 인터벌 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600&family=Archivo:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#EDEFF2;
    --surface:#FFFFFF;
    --surface-2:#E4E8ED;
    --ink:#161A21;
    --ink-2:#5D6775;
    --line:#D2D8E0;
    --accent:#E2542A;
    --accent-soft:rgba(226,84,42,.12);
    --calm:#17887A;
    --track:#D6DCE4;
    --shadow:0 1px 3px rgba(22,26,33,.07), 0 6px 20px rgba(22,26,33,.06);
    --font-num:'Oswald','Noto Sans KR',system-ui,sans-serif;
    --font-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
    --font-label:'Archivo','Noto Sans KR',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1319;
      --surface:#181D26;
      --surface-2:#212934;
      --ink:#EDF1F6;
      --ink-2:#95A1B1;
      --line:#2B333F;
      --accent:#FF7A45;
      --accent-soft:rgba(255,122,69,.16);
      --calm:#36C2A9;
      --track:#28303C;
      --shadow:0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1319;
    --surface:#181D26;
    --surface-2:#212934;
    --ink:#EDF1F6;
    --ink-2:#95A1B1;
    --line:#2B333F;
    --accent:#FF7A45;
    --accent-soft:rgba(255,122,69,.16);
    --calm:#36C2A9;
    --track:#28303C;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
  }

  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    padding-inline:20px;
    padding-block:20px 28px;
    display:flex;
    flex-direction:column;
    gap:18px;
    min-height:100%;
    box-sizing:border-box;
  }

  /* ── 헤더 ───────────────────────────── */
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .eyebrow{
    font-family:var(--font-label);
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-2);
  }
  h1{
    font-family:var(--font-num);
    font-weight:600;font-size:22px;letter-spacing:.01em;
    margin:2px 0 0;text-wrap:balance;
  }
  .ghost{
    font-family:var(--font-body);
    background:none;border:1px solid var(--line);color:var(--ink-2);
    border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;
    white-space:nowrap;
  }
  .ghost:hover{color:var(--ink);border-color:var(--ink-2);}

  /* ── 설정 ───────────────────────────── */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    box-shadow:var(--shadow);
  }
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
  .panel-title{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);}
  .locknote{font-size:11.5px;color:var(--ink-2);}
  .settings.locked{opacity:.42;pointer-events:none;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-family:var(--font-num);font-weight:500;font-size:15px;letter-spacing:.02em;
    background:var(--surface-2);color:var(--ink);
    border:1px solid transparent;border-radius:9px;
    padding:8px 13px;cursor:pointer;
  }
  .chip[aria-pressed="true"]{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .custom{
    display:flex;align-items:center;gap:7px;
    margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--ink-2);flex-wrap:wrap;
  }
  .custom input{
    width:62px;
    font-family:var(--font-num);font-size:17px;font-weight:500;
    background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;
    padding:6px 8px;text-align:center;
  }
  .custom input:focus-visible,.chip:focus-visible,.ghost:focus-visible,
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ── 다이얼 ─────────────────────────── */
  .dial{position:relative;display:grid;place-items:center;padding-block:4px;}
  .dial svg{width:min(270px,72vw);height:auto;max-width:100%;display:block;}
  .arc{transition:stroke-dashoffset .12s linear;}
  .readout{position:absolute;text-align:center;pointer-events:none;}
  .count{
    font-family:var(--font-num);font-weight:300;
    font-size:clamp(62px,19vw,80px);line-height:.95;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
    color:var(--ink);
  }
  .count-unit{font-size:.3em;font-weight:500;color:var(--ink-2);margin-left:.15em;letter-spacing:.04em;}
  .cycle{
    font-family:var(--font-label);font-size:11px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-top:6px;
  }
  .dial.pulse .arc{stroke:var(--accent);}
  .dial.pulse .count{color:var(--accent);}
  .flashring{
    position:absolute;inset:8%;border-radius:50%;
    border:3px solid var(--accent);opacity:0;
  }
  .dial.pulse .flashring{animation:ping .5s ease-out;}
  @keyframes ping{
    0%{opacity:.85;transform:scale(.94);}
    100%{opacity:0;transform:scale(1.1);}
  }
  @media (prefers-reduced-motion: reduce){
    .dial.pulse .flashring{animation:none;}
    .arc{transition:none;}
  }

  /* ── 기록 ───────────────────────────── */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:10px 13px;
  }
  .stat dt{font-family:var(--font-label);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);}
  .stat dd{
    margin:2px 0 0;font-family:var(--font-num);font-weight:500;font-size:26px;
    font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .stat dd small{font-size:13px;color:var(--ink-2);margin-left:3px;font-weight:400;}

  /* ── 조작 ───────────────────────────── */
  .controls{display:flex;gap:10px;}
  .primary{
    flex:1;
    font-family:var(--font-num);font-weight:500;font-size:21px;letter-spacing:.05em;
    background:var(--calm);color:#fff;border:none;border-radius:14px;
    padding:17px 10px;cursor:pointer;
  }
  .primary.is-running{background:var(--accent);}
  .primary:active{transform:translateY(1px);}
  .secondary{
    font-family:var(--font-num);font-weight:500;font-size:17px;letter-spacing:.04em;
    background:var(--surface);color:var(--ink-2);
    border:1px solid var(--line);border-radius:14px;padding:17px 20px;cursor:pointer;
  }
  .secondary:hover{color:var(--ink);}

  /* ── 소리 ───────────────────────────── */
  .sound-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .toggle{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer;}
  .toggle input{accent-color:var(--accent);width:16px;height:16px;}
  .vol{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);}
  .vol input[type=range]{flex:1;accent-color:var(--accent);min-width:70px;}
  .hint{font-size:12px;color:var(--ink-2);text-align:center;margin:0;}
  kbd{
    font-family:var(--font-label);font-size:11px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
    padding:1px 5px;color:var(--ink-2);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="eyebrow">Interval Beeper</div>
      <h1>운동 인터벌 타이머</h1>
    </div>
    <button type="button" class="ghost" id="preview">소리 미리듣기</button>
  </div>

  <section class="panel">
    <div class="panel-head">
      <span class="panel-title">구간 길이</span>
      <span class="locknote" id="locknote" hidden>일시정지하면 바꿀 수 있어요</span>
    </div>
    <div class="settings" id="settings">
      <div class="chips" id="chips" role="group" aria-label="구간 길이 프리셋">
        <button type="button" class="chip" data-sec="20">20초</button>
        <button type="button" class="chip" data-sec="30">30초</button>
        <button type="button" class="chip" data-sec="45">45초</button>
        <button type="button" class="chip" data-sec="60">1분</button>
        <button type="button" class="chip" data-sec="90">1분 30초</button>
        <button type="button" class="chip" data-sec="120">2분</button>
        <button type="button" class="chip" data-sec="180">3분</button>
      </div>
      <div class="custom">
        <span>직접 입력</span>
        <input type="number" id="min" min="0" max="59" step="1" value="0" inputmode="numeric" aria-label="분">
        <span>분</span>
        <input type="number" id="sec" min="0" max="59" step="1" value="30" inputmode="numeric" aria-label="초">
        <span>초</span>
      </div>
    </div>
  </section>

  <div class="dial" id="dial">
    <svg viewBox="0 0 260 260" aria-hidden="true">
      <g id="ticks"></g>
      <circle cx="130" cy="130" r="108" fill="none" stroke="var(--track)" stroke-width="12"></circle>
      <circle id="arc" class="arc" cx="130" cy="130" r="108" fill="none"
              stroke="var(--calm)" stroke-width="12" stroke-linecap="round"
              transform="rotate(-90 130 130)"
              stroke-dasharray="678.58" stroke-dashoffset="0"></circle>
    </svg>
    <div class="flashring"></div>
    <div class="readout">
      <div class="count"><span id="count">30</span><span class="count-unit" id="countUnit">초</span></div>
      <div class="cycle" id="cycle">남은 시간 · 30초마다 삐</div>
    </div>
  </div>

  <dl class="stats">
    <div class="stat">
      <dt>완료한 구간</dt>
      <dd><span id="rounds">0</span><small>회</small></dd>
    </div>
    <div class="stat">
      <dt>총 운동 시간</dt>
      <dd id="total">00:00</dd>
    </div>
  </dl>

  <div class="controls">
    <button type="button" class="primary" id="startBtn">시작</button>
    <button type="button" class="secondary" id="resetBtn">초기화</button>
  </div>

  <section class="panel">
    <div class="sound-row">
      <label class="toggle" for="tickOn">
        <input type="checkbox" id="tickOn" checked>
        매초 “띠” 소리
      </label>
      <label class="vol" for="vol">
        음량
        <input type="range" id="vol" min="0" max="100" value="70" aria-label="음량">
      </label>
    </div>
  </section>

  <p class="hint"><kbd>Space</kbd> 시작·정지 &nbsp;·&nbsp; <kbd>R</kbd> 초기화 &nbsp;·&nbsp; 실행 중에는 화면이 꺼지지 않아요</p>
</div>

<script>
(function(){
  "use strict";

  var CIRC = 2 * Math.PI * 108;   // 678.58

  var els = {
    dial: document.getElementById('dial'),
    arc: document.getElementById('arc'),
    ticks: document.getElementById('ticks'),
    count: document.getElementById('count'),
    countUnit: document.getElementById('countUnit'),
    cycle: document.getElementById('cycle'),
    rounds: document.getElementById('rounds'),
    total: document.getElementById('total'),
    startBtn: document.getElementById('startBtn'),
    resetBtn: document.getElementById('resetBtn'),
    chips: document.getElementById('chips'),
    settings: document.getElementById('settings'),
    locknote: document.getElementById('locknote'),
    min: document.getElementById('min'),
    sec: document.getElementById('sec'),
    tickOn: document.getElementById('tickOn'),
    vol: document.getElementById('vol'),
    preview: document.getElementById('preview')
  };

  var interval = 30;      // 구간 길이(초)
  var running = false;
  var accumulated = 0;    // 정지 상태까지 누적된 초
  var anchor = 0;         // 이번 구동 시작 시점(오디오 시계)
  var nextTick = 0;       // 다음 초음이 울릴 시각
  var tickIndex = 0;      // 지금까지 울린 초음 수
  var rounds = 0;
  var sched = null;
  var wakeLock = null;
  var ctx = null, master = null;

  /* ── 소리 ───────────────────────────── */
  function audio(){
    if(!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended'){ ctx.resume(); }
    return ctx;
  }
  function blip(at, freq, dur, peak, type){
    if(!ctx) return;
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(g); g.connect(master);
    osc.start(at); osc.stop(at + dur + 0.03);
  }
  function tickSound(at){ blip(at, 1046.5, 0.055, 0.16, 'triangle'); }        // 띠
  function markSound(at){ blip(at, 1760, 0.46, 0.5, 'square'); }              // 삐

  /* ── 시계 ───────────────────────────── */
  function elapsed(){
    return running ? accumulated + (ctx.currentTime - anchor) : accumulated;
  }
  function scheduler(){
    while(nextTick < ctx.currentTime + 0.15){
      tickIndex += 1;
      var isMark = (tickIndex % interval === 0);
      if(isMark){ markSound(nextTick); }
      else if(els.tickOn.checked){ tickSound(nextTick); }
      if(isMark){
        var delay = Math.max(0, (nextTick - ctx.currentTime) * 1000);
        setTimeout(onMark, delay);
      }
      nextTick += 1;
    }
  }
  function onMark(){
    rounds += 1;
    els.rounds.textContent = rounds;
    els.dial.classList.add('pulse');
    setTimeout(function(){ els.dial.classList.remove('pulse'); }, 520);
  }

  function start(){
    if(running) return;
    if(!audio()) return;
    anchor = ctx.currentTime;
    tickIndex = Math.round(accumulated);
    nextTick = anchor + ((tickIndex + 1) - accumulated);
    running = true;
    sched = setInterval(scheduler, 25);
    els.startBtn.textContent = '일시정지';
    els.startBtn.classList.add('is-running');
    els.settings.classList.add('locked');
    els.locknote.hidden = false;
    requestWakeLock();
    frame();
  }
  function pause(){
    if(!running) return;
    accumulated = elapsed();
    running = false;
    clearInterval(sched); sched = null;
    els.startBtn.textContent = '이어서 시작';
    els.startBtn.classList.remove('is-running');
    els.settings.classList.remove('locked');
    els.locknote.hidden = true;
    releaseWakeLock();
    render();
  }
  function reset(){
    var wasRunning = running;
    if(wasRunning) pause();
    accumulated = 0; tickIndex = 0; rounds = 0;
    els.rounds.textContent = '0';
    els.startBtn.textContent = '시작';
    render();
  }

  /* ── 화면 ───────────────────────────── */
  function mmss(t){
    var s = Math.floor(t);
    var m = Math.floor(s / 60);
    return (m < 10 ? '0' : '') + m + ':' + ((s % 60) < 10 ? '0' : '') + (s % 60);
  }
  function render(){
    var e = elapsed();
    var into = e % interval;
    var remain = interval - into;
    if(remain > interval - 0.0005) remain = interval;

    if(interval > 60){
      els.count.textContent = mmss(Math.ceil(remain - 0.0001));
      els.countUnit.textContent = '';
    }else{
      els.count.textContent = Math.max(0, Math.ceil(remain - 0.0001));
      els.countUnit.textContent = '초';
    }
    els.arc.setAttribute('stroke-dashoffset', String(CIRC * (1 - remain / interval)));
    els.total.textContent = mmss(e);
  }
  function frame(){
    if(!running) return;
    render();
    requestAnimationFrame(frame);
  }

  function drawTicks(){
    var n = interval <= 60 ? interval : Math.min(36, Math.round(interval / 10));
    var out = '';
    for(var i = 0; i < n; i++){
      var a = (i / n) * Math.PI * 2 - Math.PI / 2;
      var r1 = 90, r2 = (n <= 12 || i % 5 === 0) ? 82 : 85;
      out += '<line x1="' + (130 + Math.cos(a) * r1).toFixed(2) + '" y1="' + (130 + Math.sin(a) * r1).toFixed(2) +
             '" x2="' + (130 + Math.cos(a) * r2).toFixed(2) + '" y2="' + (130 + Math.sin(a) * r2).toFixed(2) +
             '" stroke="var(--track)" stroke-width="' + ((i % 5 === 0) ? 2.4 : 1.4) + '" stroke-linecap="round"></line>';
    }
    els.ticks.innerHTML = out;
  }
  function label(){
    var t = interval >= 60
      ? (interval % 60 === 0 ? (interval / 60) + '분' : Math.floor(interval / 60) + '분 ' + (interval % 60) + '초')
      : interval + '초';
    els.cycle.textContent = '남은 시간 · ' + t + '마다 삐';
  }

  /* ── 설정 ───────────────────────────── */
  function setInterval_(sec, fromInputs){
    sec = Math.max(1, Math.min(3600, Math.round(sec)));
    interval = sec;
    if(!fromInputs){
      els.min.value = Math.floor(sec / 60);
      els.sec.value = sec % 60;
    }
    var chips = els.chips.querySelectorAll('.chip');
    for(var i = 0; i < chips.length; i++){
      chips[i].setAttribute('aria-pressed', String(Number(chips[i].dataset.sec) === sec));
    }
    drawTicks(); label();
    accumulated = 0; tickIndex = 0; rounds = 0;
    els.rounds.textContent = '0';
    try{ localStorage.setItem('interval-sec', String(sec)); }catch(err){}
    render();
  }

  els.chips.addEventListener('click', function(ev){
    var b = ev.target.closest('.chip');
    if(b) setInterval_(Number(b.dataset.sec), false);
  });
  function fromInputs(){
    var m = Number(els.min.value) || 0, s = Number(els.sec.value) || 0;
    var total = m * 60 + s;
    if(total < 1) return;
    setInterval_(total, true);
  }
  els.min.addEventListener('change', fromInputs);
  els.sec.addEventListener('change', fromInputs);

  els.vol.addEventListener('input', function(){
    if(master) master.gain.value = Number(els.vol.value) / 100;
  });
  els.preview.addEventListener('click', function(){
    if(!audio()) return;
    master.gain.value = Number(els.vol.value) / 100;
    var t = ctx.currentTime + 0.05;
    tickSound(t); tickSound(t + 0.5); tickSound(t + 1.0); markSound(t + 1.5);
  });

  els.startBtn.addEventListener('click', function(){
    if(master) master.gain.value = Number(els.vol.value) / 100;
    running ? pause() : start();
  });
  els.resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', function(ev){
    if(/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    if(ev.code === 'Space'){ ev.preventDefault(); running ? pause() : start(); }
    if(ev.code === 'KeyR'){ reset(); }
  });

  /* ── 화면 켜둠 ──────────────────────── */
  function requestWakeLock(){
    try{
      if(navigator.wakeLock && navigator.wakeLock.request){
        navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; }, function(){});
      }
    }catch(err){}
  }
  function releaseWakeLock(){
    try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(err){}
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && running) requestWakeLock();
  });

  var saved = 30;
  try{ var v = Number(localStorage.getItem('interval-sec')); if(v >= 1) saved = v; }catch(err){}
  setInterval_(saved, false);
})();
</script>
</body>
</html>
